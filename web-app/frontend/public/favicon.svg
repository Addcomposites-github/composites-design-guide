<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- OpenComposites favicon - layered composite plies -->
  <rect width="32" height="32" rx="6" fill="#bf3425"/>
  <g transform="translate(6,7)" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none">
    <!-- Three angled composite plies -->
    <line x1="0" y1="4" x2="20" y2="4"/>
    <line x1="2" y1="9" x2="18" y2="9" transform="rotate(-8,10,9)"/>
    <line x1="0" y1="14" x2="20" y2="14"/>
  </g>
  <text x="16" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" font-weight="bold" fill="#fff">OC</text>
</svg>
