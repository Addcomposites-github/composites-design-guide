<!-- Original diagram by AddComposites, CC BY 4.0, composites-design-guide -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 580" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Manufacturing Process Selection Flowchart</text>
  <text x="375" y="46" text-anchor="middle" font-size="12" fill="#64748b">Answer three questions to find your process</text>

  <!-- Start node -->
  <rect x="280" y="60" width="190" height="40" rx="20" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>
  <text x="375" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="white">What geometry?</text>

  <!-- Geometry branches -->
  <!-- Flat/curved -->
  <line x1="315" y1="100" x2="150" y2="140" stroke="#475569" stroke-width="1.5"/>
  <rect x="50" y="140" width="200" height="35" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Flat / Gently Curved</text>

  <!-- Complex 3D -->
  <line x1="375" y1="100" x2="375" y2="140" stroke="#475569" stroke-width="1.5"/>
  <rect x="275" y="140" width="200" height="35" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="375" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">Complex 3D Shape</text>

  <!-- Axisymmetric -->
  <line x1="435" y1="100" x2="560" y2="140" stroke="#475569" stroke-width="1.5"/>
  <rect x="500" y="140" width="200" height="35" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="600" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#a16207">Axisymmetric / Tube</text>

  <!-- Constant X-section -->
  <line x1="470" y1="100" x2="670" y2="150" stroke="#475569" stroke-width="1.5"/>
  <rect x="615" y="145" width="120" height="35" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="675" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">Constant X-sec</text>

  <!-- Volume question for flat/curved -->
  <line x1="150" y1="175" x2="150" y2="200" stroke="#475569" stroke-width="1.5"/>
  <rect x="55" y="200" width="190" height="35" rx="15" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="150" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="white">How many per year?</text>

  <!-- Volume branches for flat/curved -->
  <line x1="90" y1="235" x2="55" y2="260" stroke="#475569" stroke-width="1"/>
  <rect x="10" y="260" width="100" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">1-20</text>
  <text x="60" y="293" text-anchor="middle" font-size="9" fill="#475569">Wet Layup +</text>
  <text x="60" y="303" text-anchor="middle" font-size="9" fill="#475569">Vacuum Bag</text>

  <line x1="120" y1="235" x2="130" y2="260" stroke="#475569" stroke-width="1"/>
  <rect x="115" y="260" width="80" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">20-200</text>
  <text x="155" y="295" text-anchor="middle" font-size="9" fill="#475569">VARTM</text>

  <line x1="170" y1="235" x2="220" y2="260" stroke="#475569" stroke-width="1"/>
  <rect x="200" y="260" width="80" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="240" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">200-5k</text>
  <text x="240" y="295" text-anchor="middle" font-size="9" fill="#475569">RTM / Prepreg</text>

  <line x1="210" y1="235" x2="305" y2="260" stroke="#475569" stroke-width="1"/>
  <rect x="285" y="260" width="80" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="325" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">5,000+</text>
  <text x="325" y="295" text-anchor="middle" font-size="9" fill="#475569">HP-RTM</text>

  <!-- Quality question for complex 3D -->
  <line x1="375" y1="175" x2="375" y2="200" stroke="#475569" stroke-width="1.5"/>
  <rect x="290" y="200" width="170" height="35" rx="15" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="375" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Quality class?</text>

  <!-- Quality branches -->
  <line x1="340" y1="235" x2="340" y2="330" stroke="#475569" stroke-width="1"/>
  <rect x="300" y="330" width="80" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Hobby</text>
  <text x="340" y="365" text-anchor="middle" font-size="9" fill="#475569">Wet Layup</text>

  <line x1="375" y1="235" x2="420" y2="330" stroke="#475569" stroke-width="1"/>
  <rect x="385" y="330" width="80" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="425" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Structural</text>
  <text x="425" y="365" text-anchor="middle" font-size="9" fill="#475569">Prepreg/Oven</text>
  <text x="425" y="375" text-anchor="middle" font-size="9" fill="#475569">or Infusion</text>

  <line x1="410" y1="235" x2="500" y2="330" stroke="#475569" stroke-width="1"/>
  <rect x="475" y="330" width="80" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="515" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Aerospace</text>
  <text x="515" y="365" text-anchor="middle" font-size="9" fill="#475569">Prepreg +</text>
  <text x="515" y="375" text-anchor="middle" font-size="9" fill="#475569">Autoclave</text>

  <!-- Direct answers -->
  <!-- Filament Winding -->
  <line x1="600" y1="175" x2="600" y2="210" stroke="#475569" stroke-width="1.5"/>
  <rect x="540" y="210" width="120" height="40" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="600" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Filament</text>
  <text x="600" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Winding</text>

  <!-- Pultrusion -->
  <line x1="675" y1="180" x2="675" y2="210" stroke="#475569" stroke-width="1.5"/>
  <rect x="620" y="260" width="110" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="675" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">Pultrusion</text>
  <line x1="675" y1="210" x2="675" y2="260" stroke="#475569" stroke-width="1.5"/>
  <text x="675" y="250" text-anchor="middle" font-size="9" fill="#475569">500m+ run</text>

  <!-- Summary box -->
  <rect x="50" y="420" width="650" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="442" font-size="12" font-weight="bold" fill="#1e293b">Three Questions to Start:</text>
  <text x="80" y="462" font-size="11" fill="#475569">1. What geometry? — Eliminates most options immediately</text>
  <text x="80" y="478" font-size="11" fill="#475569">2. How many parts per year? — Determines whether automation (AFP, RTM, HP-RTM) pays off</text>
  <text x="80" y="494" font-size="11" fill="#475569">3. What quality class? — Hobby (Vf 35-50%), Structural (Vf 50-60%), Aerospace (Vf 55-65%, voids &lt;1%)</text>

  <!-- Cost note -->
  <text x="375" y="520" text-anchor="middle" font-size="11" fill="#94a3b8">When in doubt, start with the simplest process that meets your quality requirements.</text>

  <!-- AFP-XS callout -->
  <rect x="450" y="530" width="260" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="580" y="548" text-anchor="middle" font-size="10" fill="#1e40af">AFP-XS makes automated placement</text>
  <text x="580" y="562" text-anchor="middle" font-size="10" fill="#1e40af">accessible from 100+ parts/year</text>
</svg>
