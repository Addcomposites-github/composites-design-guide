<!-- Original diagram by AddComposites, CC BY 4.0, composites-design-guide -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Resin Infusion (VARTM) Schematic</text>
  <text x="375" y="46" text-anchor="middle" font-size="12" fill="#64748b">Vacuum Assisted Resin Transfer Moulding — single-sided mould process</text>

  <!-- Mould surface -->
  <rect x="80" y="260" width="550" height="25" fill="#94a3b8" stroke="#475569" stroke-width="2" rx="3"/>
  <text x="355" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Mould Surface</text>

  <!-- Release agent -->
  <line x1="100" y1="260" x2="610" y2="260" stroke="#a855f7" stroke-width="2"/>

  <!-- Dry fibre preform -->
  <rect x="100" y="215" width="510" height="45" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="2"/>
  <!-- Fibre texture -->
  <g stroke="#0284c7" stroke-width="0.5" opacity="0.3">
    <line x1="110" y1="220" x2="110" y2="255"/>
    <line x1="125" y1="220" x2="125" y2="255"/>
    <line x1="140" y1="220" x2="140" y2="255"/>
    <line x1="155" y1="220" x2="155" y2="255"/>
    <line x1="170" y1="220" x2="170" y2="255"/>
    <line x1="185" y1="220" x2="185" y2="255"/>
    <line x1="200" y1="220" x2="200" y2="255"/>
    <line x1="215" y1="220" x2="215" y2="255"/>
    <line x1="230" y1="220" x2="230" y2="255"/>
    <line x1="245" y1="220" x2="245" y2="255"/>
    <line x1="260" y1="220" x2="260" y2="255"/>
    <line x1="275" y1="220" x2="275" y2="255"/>
    <line x1="290" y1="220" x2="290" y2="255"/>
    <line x1="305" y1="220" x2="305" y2="255"/>
    <line x1="320" y1="220" x2="320" y2="255"/>
    <line x1="335" y1="220" x2="335" y2="255"/>
    <line x1="350" y1="220" x2="350" y2="255"/>
    <line x1="365" y1="220" x2="365" y2="255"/>
    <line x1="380" y1="220" x2="380" y2="255"/>
    <line x1="395" y1="220" x2="395" y2="255"/>
    <line x1="410" y1="220" x2="410" y2="255"/>
    <line x1="425" y1="220" x2="425" y2="255"/>
    <line x1="440" y1="220" x2="440" y2="255"/>
    <line x1="455" y1="220" x2="455" y2="255"/>
    <line x1="470" y1="220" x2="470" y2="255"/>
    <line x1="485" y1="220" x2="485" y2="255"/>
    <line x1="500" y1="220" x2="500" y2="255"/>
    <line x1="515" y1="220" x2="515" y2="255"/>
    <line x1="530" y1="220" x2="530" y2="255"/>
    <line x1="545" y1="220" x2="545" y2="255"/>
    <line x1="560" y1="220" x2="560" y2="255"/>
    <line x1="575" y1="220" x2="575" y2="255"/>
    <line x1="590" y1="220" x2="590" y2="255"/>
    <line x1="605" y1="220" x2="605" y2="255"/>
  </g>
  <text x="355" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">Dry Fibre Preform</text>

  <!-- Flow front (resin moving from left to right) -->
  <rect x="100" y="215" width="300" height="45" fill="#3b82f6" opacity="0.25" rx="2"/>
  <line x1="400" y1="215" x2="400" y2="260" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="400" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Flow Front</text>

  <!-- Peel ply -->
  <rect x="95" y="200" width="520" height="15" fill="#e9d5ff" stroke="#a855f7" stroke-width="1" rx="1"/>
  <text x="660" y="212" font-size="10" fill="#7c3aed">Peel Ply</text>

  <!-- Flow mesh / distribution media -->
  <rect x="90" y="175" width="530" height="25" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="2"/>
  <!-- Mesh pattern -->
  <g stroke="#10b981" stroke-width="0.6" opacity="0.4">
    <line x1="100" y1="180" x2="100" y2="195"/>
    <line x1="120" y1="180" x2="120" y2="195"/>
    <line x1="140" y1="180" x2="140" y2="195"/>
    <line x1="160" y1="180" x2="160" y2="195"/>
    <line x1="180" y1="180" x2="180" y2="195"/>
    <line x1="200" y1="180" x2="200" y2="195"/>
    <line x1="220" y1="180" x2="220" y2="195"/>
    <line x1="240" y1="180" x2="240" y2="195"/>
    <line x1="260" y1="180" x2="260" y2="195"/>
    <line x1="280" y1="180" x2="280" y2="195"/>
    <line x1="300" y1="180" x2="300" y2="195"/>
    <line x1="320" y1="180" x2="320" y2="195"/>
    <line x1="340" y1="180" x2="340" y2="195"/>
    <line x1="360" y1="180" x2="360" y2="195"/>
    <line x1="380" y1="180" x2="380" y2="195"/>
    <line x1="400" y1="180" x2="400" y2="195"/>
    <line x1="95" y1="187" x2="615" y2="187"/>
  </g>
  <text x="355" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">Flow Distribution Mesh</text>

  <!-- Vacuum bag -->
  <path d="M 70,170 Q 70,155 85,155 L 625,155 Q 640,155 640,170 L 640,285 Q 640,295 635,295 L 75,295 Q 70,295 70,285 Z"
    fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <text x="355" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">Vacuum Bag</text>

  <!-- Sealant tape -->
  <rect x="65" y="285" width="20" height="10" fill="#fbbf24" stroke="#d97706" stroke-width="1" rx="1"/>
  <rect x="625" y="285" width="20" height="10" fill="#fbbf24" stroke="#d97706" stroke-width="1" rx="1"/>

  <!-- Resin inlet (left side) -->
  <rect x="25" y="220" width="45" height="50" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="47" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="white">RESIN</text>
  <text x="47" y="253" text-anchor="middle" font-size="9" font-weight="bold" fill="white">POT</text>
  <!-- Inlet tube -->
  <line x1="70" y1="237" x2="100" y2="237" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <!-- Flow arrows -->
  <polygon points="95,231 105,237 95,243" fill="#2563eb"/>

  <!-- Resin flow direction arrows -->
  <g fill="#2563eb" opacity="0.5">
    <polygon points="180,237 190,232 190,242"/>
    <polygon points="250,237 260,232 260,242"/>
    <polygon points="320,237 330,232 330,242"/>
    <polygon points="370,237 380,232 380,242"/>
  </g>

  <!-- Vacuum outlet (right side) -->
  <line x1="610" y1="187" x2="660" y2="187" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
  <rect x="660" y="165" width="65" height="45" fill="#f1f5f9" stroke="#0ea5e9" stroke-width="2" rx="5"/>
  <text x="692" y="183" text-anchor="middle" font-size="9" font-weight="bold" fill="#0284c7">VACUUM</text>
  <text x="692" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#0284c7">PUMP</text>
  <!-- Suction arrow -->
  <polygon points="655,182 645,187 655,192" fill="#0ea5e9"/>

  <!-- Catch pot / resin trap -->
  <rect x="660" y="215" width="40" height="35" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3"/>
  <text x="680" y="237" text-anchor="middle" font-size="8" font-weight="600" fill="#92400e">TRAP</text>
  <line x1="660" y1="233" x2="640" y2="187" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Key info box -->
  <rect x="60" y="310" width="630" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="330" font-size="12" font-weight="bold" fill="#1e293b">Process Parameters</text>
  <text x="80" y="348" font-size="11" fill="#475569">Vacuum: -0.90 to -0.95 bar gauge | Resin viscosity: 200-500 mPa.s at infusion temperature</text>
  <text x="80" y="364" font-size="11" fill="#475569">Achievable Vf: 50-60% | Void content: 1-3% | Typical part size: 1-100 m2</text>
  <text x="80" y="382" font-size="11" fill="#94a3b8">Use the Resin Flow Simulator (addcomposites.com) to predict flow times and optimize inlet/vent placement.</text>
</svg>
