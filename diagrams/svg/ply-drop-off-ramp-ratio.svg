<!-- Original diagram by AddComposites, CC BY 4.0, composites-design-guide -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Ply Drop-Off Geometry</text>
  <text x="350" y="48" text-anchor="middle" font-size="12" fill="#64748b">Ramp ratio and taper design for laminate thickness transitions</text>

  <!-- Thick region (left) -->
  <rect x="50" y="100" width="200" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="1"/>
  <rect x="50" y="120" width="200" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="1"/>
  <rect x="50" y="140" width="200" height="20" fill="#fef9c3" stroke="#eab308" stroke-width="1" rx="1"/>
  <rect x="50" y="160" width="200" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="1"/>
  <rect x="50" y="180" width="200" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="1"/>
  <rect x="50" y="200" width="200" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="1"/>

  <!-- Transition region (tapered plies) -->
  <!-- Ply 1: continuous -->
  <rect x="250" y="100" width="200" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="1"/>
  <!-- Ply 2: dropped at position 1 -->
  <polygon points="250,120 310,120 310,140 250,140" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <!-- Ply 3: continuous (shifted up) -->
  <rect x="250" y="120" width="200" height="20" fill="#fef9c3" stroke="#eab308" stroke-width="1" rx="1"/>
  <!-- Ply 4: dropped at position 2 -->
  <polygon points="250,160 370,140 370,160 250,160" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <!-- Ply 5: continuous (shifted up) -->
  <rect x="250" y="140" width="200" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="1"/>
  <!-- Ply 6: dropped at position 3 -->
  <polygon points="250,200 430,160 430,180 250,220" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="250" y="160" width="200" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="1"/>

  <!-- Thin region (right) -->
  <rect x="450" y="100" width="200" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="1"/>
  <rect x="450" y="120" width="200" height="20" fill="#fef9c3" stroke="#eab308" stroke-width="1" rx="1"/>
  <rect x="450" y="140" width="200" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="1"/>
  <rect x="450" y="160" width="200" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="1"/>

  <!-- Ramp ratio dimension -->
  <line x1="310" y1="240" x2="430" y2="240" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="310,240 316,236 316,244" fill="#0f172a"/>
  <polygon points="430,240 424,236 424,244" fill="#0f172a"/>
  <text x="370" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Drop-off distance (d)</text>

  <!-- Thickness dimension -->
  <line x1="38" y1="100" x2="38" y2="220" stroke="#0f172a" stroke-width="1"/>
  <polygon points="38,100 34,106 42,106" fill="#0f172a"/>
  <polygon points="38,220 34,214 42,214" fill="#0f172a"/>
  <text x="28" y="165" text-anchor="middle" font-size="11" fill="#0f172a" transform="rotate(-90, 28, 165)">Thick (6 plies)</text>

  <line x1="660" y1="100" x2="660" y2="180" stroke="#0f172a" stroke-width="1"/>
  <polygon points="660,100 656,106 664,106" fill="#0f172a"/>
  <polygon points="660,180 656,174 664,174" fill="#0f172a"/>
  <text x="672" y="145" font-size="11" fill="#0f172a" transform="rotate(-90, 672, 145)">Thin (4 plies)</text>

  <!-- Drop-off markers -->
  <circle cx="310" cy="130" r="6" fill="#f97316" stroke="white" stroke-width="2"/>
  <text x="310" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="white">1</text>

  <circle cx="370" cy="150" r="6" fill="#f97316" stroke="white" stroke-width="2"/>
  <text x="370" y="154" text-anchor="middle" font-size="9" font-weight="bold" fill="white">2</text>

  <!-- Labels -->
  <text x="150" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Thick Zone</text>
  <text x="550" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Thin Zone</text>
  <text x="350" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#f97316">Taper Zone</text>

  <!-- Ramp ratio formula -->
  <rect x="120" y="272" width="460" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="350" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Ramp Ratio = d / t</text>
  <text x="350" y="312" text-anchor="middle" font-size="12" fill="#475569">Typical values: 1:8 (minimum) to 1:20 (conservative) — where t = dropped ply thickness</text>
  <text x="350" y="326" text-anchor="middle" font-size="11" fill="#94a3b8">Drop internal plies only. Never drop surface plies. Stagger drops by at least 4 mm.</text>
</svg>
