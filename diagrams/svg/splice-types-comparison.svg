<!-- Original diagram by AddComposites, CC BY 4.0, composites-design-guide -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 500" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="325" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Splice Types Comparison</text>
  <text x="325" y="46" text-anchor="middle" font-size="12" fill="#64748b">Methods for joining ply sections within a laminate</text>

  <!-- 1. Butt Splice -->
  <text x="80" y="80" font-size="14" font-weight="bold" fill="#1e293b">1. Butt Splice</text>
  <text x="450" y="80" font-size="11" fill="#94a3b8">Simplest | Weakest | Gap = 0-2 mm</text>

  <!-- Left ply -->
  <rect x="80" y="90" width="200" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="2"/>
  <!-- Right ply -->
  <rect x="285" y="90" width="200" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="2"/>
  <!-- Gap indicator -->
  <line x1="280" y1="85" x2="280" y2="120" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="280" y="130" text-anchor="middle" font-size="10" fill="#dc2626">Gap (0-2 mm)</text>

  <!-- Continuous plies above/below -->
  <rect x="60" y="75" width="440" height="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="1" opacity="0.7"/>
  <rect x="60" y="115" width="440" height="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="1" opacity="0.7"/>
  <text x="525" y="108" font-size="10" fill="#475569">No load transfer</text>
  <text x="525" y="120" font-size="10" fill="#475569">at the gap</text>

  <!-- 2. Overlap Splice -->
  <text x="80" y="170" font-size="14" font-weight="bold" fill="#1e293b">2. Overlap Splice</text>
  <text x="450" y="170" font-size="11" fill="#94a3b8">Common | Moderate strength | Overlap = 15-25 mm</text>

  <!-- Left ply -->
  <rect x="80" y="180" width="230" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="2"/>
  <!-- Right ply (overlapping) -->
  <rect x="260" y="180" width="230" height="25" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" rx="2"/>
  <!-- Overlap zone -->
  <rect x="260" y="178" width="50" height="29" fill="#f97316" opacity="0.2" stroke="#f97316" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Overlap dimension -->
  <line x1="260" y1="215" x2="310" y2="215" stroke="#0f172a" stroke-width="1"/>
  <polygon points="260,215 266,211 266,219" fill="#0f172a"/>
  <polygon points="310,215 304,211 304,219" fill="#0f172a"/>
  <text x="285" y="228" text-anchor="middle" font-size="10" fill="#0f172a">Overlap (15-25 mm)</text>

  <text x="525" y="195" font-size="10" fill="#475569">Creates local</text>
  <text x="525" y="207" font-size="10" fill="#475569">thickness bump</text>

  <!-- 3. Scarf Splice -->
  <text x="80" y="270" font-size="14" font-weight="bold" fill="#1e293b">3. Scarf Splice</text>
  <text x="450" y="270" font-size="11" fill="#94a3b8">Best quality | Tapered | Angle = 1:20 to 1:50</text>

  <!-- Left ply (tapered end) -->
  <polygon points="80,290 300,290 300,315 280,315 80,315" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Right ply (tapered start) -->
  <polygon points="280,290 490,290 490,315 300,315 300,290" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>

  <!-- Scarf line -->
  <line x1="280" y1="315" x2="300" y2="290" stroke="#dc2626" stroke-width="2"/>

  <!-- Scarf angle dimension -->
  <path d="M 280,315 L 310,315" fill="none" stroke="#0f172a" stroke-width="0.8"/>
  <path d="M 300,290 L 300,315" fill="none" stroke="#0f172a" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="305" y="308" font-size="9" fill="#0f172a">θ</text>

  <text x="525" y="298" font-size="10" fill="#475569">Smooth load</text>
  <text x="525" y="310" font-size="10" fill="#475569">transfer path</text>

  <!-- 4. Staggered Butt Splice -->
  <text x="80" y="365" font-size="14" font-weight="bold" fill="#1e293b">4. Staggered Butt Splice</text>
  <text x="450" y="365" font-size="11" fill="#94a3b8">Practical | Good strength | Stagger offset = 10-15 mm</text>

  <!-- Multiple plies with staggered gaps -->
  <!-- Ply 1 -->
  <rect x="80" y="375" width="170" height="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="1"/>
  <rect x="255" y="375" width="230" height="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="1"/>
  <!-- Ply 2 -->
  <rect x="80" y="390" width="200" height="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="1"/>
  <rect x="285" y="390" width="200" height="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="1"/>
  <!-- Ply 3 -->
  <rect x="80" y="405" width="230" height="15" fill="#fef9c3" stroke="#eab308" stroke-width="1" rx="1"/>
  <rect x="315" y="405" width="170" height="15" fill="#fef9c3" stroke="#eab308" stroke-width="1" rx="1"/>

  <!-- Gap markers -->
  <line x1="250" y1="373" x2="250" y2="392" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="280" y1="388" x2="280" y2="407" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="310" y1="403" x2="310" y2="422" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Stagger dimension -->
  <line x1="250" y1="430" x2="310" y2="430" stroke="#0f172a" stroke-width="1"/>
  <polygon points="250,430 256,426 256,434" fill="#0f172a"/>
  <polygon points="310,430 304,426 304,434" fill="#0f172a"/>
  <text x="280" y="443" text-anchor="middle" font-size="10" fill="#0f172a">Stagger (10-15 mm min)</text>

  <text x="525" y="395" font-size="10" fill="#475569">No two gaps</text>
  <text x="525" y="407" font-size="10" fill="#475569">aligned</text>

  <!-- Summary box -->
  <rect x="60" y="460" width="530" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="325" y="480" text-anchor="middle" font-size="11" fill="#475569">Best practice: Stagger butt splices by 10-15 mm min. Never align splices in adjacent plies. Scarf for repairs.</text>
</svg>
