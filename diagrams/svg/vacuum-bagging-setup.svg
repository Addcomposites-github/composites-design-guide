<!-- Original diagram by AddComposites, CC BY 4.0, composites-design-guide -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Vacuum Bagging Setup</text>
  <text x="350" y="46" text-anchor="middle" font-size="12" fill="#64748b">Cross-section showing consumable stack for wet layup + vacuum bag</text>

  <!-- Mould / Tool surface -->
  <rect x="60" y="280" width="520" height="30" fill="#94a3b8" stroke="#475569" stroke-width="2" rx="3"/>
  <text x="320" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Mould / Tool Surface</text>

  <!-- Release agent (thin line on mould) -->
  <line x1="80" y1="280" x2="560" y2="280" stroke="#a855f7" stroke-width="3"/>
  <text x="600" y="283" font-size="11" fill="#7c3aed">Release Agent</text>

  <!-- Release film / peel ply (bottom) -->
  <rect x="80" y="265" width="480" height="15" fill="#e9d5ff" stroke="#a855f7" stroke-width="1" rx="1"/>
  <text x="600" y="277" font-size="11" fill="#7c3aed">Peel Ply</text>

  <!-- Laminate -->
  <rect x="100" y="215" width="440" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="2"/>
  <text x="320" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Composite Laminate</text>
  <text x="320" y="255" text-anchor="middle" font-size="10" fill="#3b82f6">(Fibre + Resin)</text>

  <!-- Peel ply (top) -->
  <rect x="90" y="200" width="460" height="15" fill="#e9d5ff" stroke="#a855f7" stroke-width="1" rx="1"/>
  <text x="600" y="212" font-size="11" fill="#7c3aed">Peel Ply (top)</text>

  <!-- Release film (perforated) -->
  <rect x="85" y="185" width="470" height="15" fill="#fbcfe8" stroke="#ec4899" stroke-width="1" rx="1" stroke-dasharray="8,3"/>
  <text x="600" y="197" font-size="11" fill="#db2777">Perforated Release Film</text>

  <!-- Breather / bleeder -->
  <rect x="70" y="155" width="500" height="30" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="2"/>
  <!-- Breather texture -->
  <g fill="#10b981" opacity="0.3">
    <circle cx="90" cy="170" r="3"/>
    <circle cx="110" cy="165" r="3"/>
    <circle cx="130" cy="175" r="3"/>
    <circle cx="150" cy="168" r="3"/>
    <circle cx="170" cy="172" r="3"/>
    <circle cx="190" cy="165" r="3"/>
    <circle cx="210" cy="170" r="3"/>
    <circle cx="230" cy="175" r="3"/>
    <circle cx="250" cy="168" r="3"/>
    <circle cx="270" cy="172" r="3"/>
    <circle cx="290" cy="165" r="3"/>
    <circle cx="310" cy="170" r="3"/>
    <circle cx="330" cy="175" r="3"/>
    <circle cx="350" cy="168" r="3"/>
    <circle cx="370" cy="172" r="3"/>
    <circle cx="390" cy="165" r="3"/>
    <circle cx="410" cy="170" r="3"/>
    <circle cx="430" cy="175" r="3"/>
    <circle cx="450" cy="168" r="3"/>
    <circle cx="470" cy="172" r="3"/>
    <circle cx="490" cy="165" r="3"/>
    <circle cx="510" cy="170" r="3"/>
    <circle cx="530" cy="175" r="3"/>
    <circle cx="550" cy="168" r="3"/>
  </g>
  <text x="320" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Breather / Bleeder Fabric</text>

  <!-- Vacuum bag -->
  <path d="M 50,150 L 50,130 Q 50,120 60,120 L 580,120 Q 590,120 590,130 L 590,150 L 570,155 L 570,310 Q 570,315 575,315 L 590,315 Q 595,315 595,310 L 595,120 Q 595,115 590,115"
    fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <path d="M 50,150 L 70,155 L 70,310 Q 70,315 65,315 L 50,315 Q 45,315 45,310 L 45,120 Q 45,115 50,115"
    fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <line x1="60" y1="120" x2="580" y2="120" stroke="#0ea5e9" stroke-width="3"/>

  <text x="320" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">Vacuum Bag</text>

  <!-- Sealant tape (both sides) -->
  <rect x="45" y="305" width="30" height="15" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" rx="2"/>
  <rect x="565" y="305" width="30" height="15" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" rx="2"/>
  <text x="600" y="316" font-size="11" fill="#d97706">Sealant Tape</text>

  <!-- Vacuum port -->
  <rect x="285" y="105" width="70" height="20" fill="#f1f5f9" stroke="#0ea5e9" stroke-width="2" rx="3"/>
  <text x="320" y="119" text-anchor="middle" font-size="10" font-weight="600" fill="#0284c7">VAC PORT</text>
  <!-- Hose -->
  <line x1="320" y1="105" x2="320" y2="80" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">To Vacuum Pump</text>

  <!-- Pressure arrows -->
  <g fill="#ef4444" opacity="0.6">
    <polygon points="120,72 125,82 115,82"/>
    <polygon points="200,72 205,82 195,82"/>
    <polygon points="280,72 285,82 275,82"/>
    <polygon points="360,72 365,82 355,82"/>
    <polygon points="440,72 445,82 435,82"/>
    <polygon points="520,72 525,82 515,82"/>
  </g>
  <text x="520" y="70" font-size="11" font-weight="600" fill="#ef4444">Atmospheric Pressure (~1 bar)</text>

  <!-- Layer order note -->
  <rect x="60" y="335" width="580" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="355" font-size="12" font-weight="bold" fill="#1e293b">Stack Order (bottom to top):</text>
  <text x="80" y="373" font-size="11" fill="#475569">1. Apply release agent to mould  2. Lay peel ply  3. Lay up composite laminate  4. Apply top peel ply</text>
  <text x="80" y="389" font-size="11" fill="#475569">5. Apply perforated release film  6. Place breather fabric  7. Seal vacuum bag with sealant tape  8. Connect vacuum port</text>
  <text x="80" y="405" font-size="11" fill="#94a3b8">Target vacuum: -0.9 to -0.95 bar gauge. Hold under vacuum until resin cures (typically 4-24 hours at room temp).</text>
</svg>
